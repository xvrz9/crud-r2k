<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUD R2K</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <header>
    <div class="encabezado">
      <div class="marca">R2K <span>Inventario y ventas</span></div>
      <nav>
        <a href="/" class="{{ 'activo' if request.path == '/' or request.path.startswith('/editar') }}">Productos</a>
        <a href="/ventas" class="{{ 'activo' if request.path == '/ventas' }}">Ventas</a>
        <a href="/reporte" class="{{ 'activo' if request.path == '/reporte' }}">Reporte del mes</a>
      </nav>
    </div>
  </header>
  <main>
    <p id="mensaje" class="mensaje" hidden></p>
    {% if error %}<p class="mensaje error">{{ error }}</p>{% endif %}
    {% block contenido %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
